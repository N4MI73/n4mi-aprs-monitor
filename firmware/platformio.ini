; N4MI Desktop Instrument Series - APRSMon
; Lives at firmware/platformio.ini in the n4mi-aprs-monitor repo -- open the
; firmware/ subfolder itself in VS Code, not the repo root, or PlatformIO
; will not find this file.
;
; Board: LilyGO T-Encoder Pro (ESP32-S3-R8, 16MB flash, 8MB OPI PSRAM)
; Identical hardware to n4mi-propagation-monitor -- this config is adapted
; directly from that project's verified-working platformio.ini, not written
; from scratch.
;
; PLATFORM NOTE: Using pioarduino community fork, NOT official platformio
; espressif32. Reason: current Arduino_GFX (needed for Arduino_CO5300
; support) requires ESP32 Arduino core 3.x headers (esp32-hal-periman.h).
; Official PlatformIO espressif32 only supports core 2.x.
;
; WINDOWS LONG PATH NOTE: Requires Windows long path support enabled
; (registry LongPathsEnabled = 1).
;
; WI-FI/HTTP NOTE: WiFi.h and HTTPClient.h ship with the ESP32 Arduino core
; itself -- no lib_deps entry needed for either. ArduinoJson is the one
; genuinely external dependency, needed here to parse aprs.fi's JSON
; responses, same role it plays for PropMon's JSON in the sibling project.

[env:tencoder-pro]
; Pinned 2026-08-12 to the release that "stable" pointed to at that time
; (verified identical SHA256 before pinning). To take a future pioarduino
; update deliberately, bump the tag below after a test build, not automatically.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -mfix-esp32-psram-cache-issue

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.7   ; see note below -- verify before committing
    lewisxhe/SensorLib @ 0.1.4
    bblanchon/ArduinoJson @ 7.4.3
